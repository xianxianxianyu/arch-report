称“happy path 上 exactly-once”，不能外推为端到端严格一次。 对 agent 服务器的采用设计 新增 agentrun 注册表：runid/rootrunid/parentrunid/tenantid/inputhash/budgetdeadline/leaseepoch/state/latestmilestone。入口先以幂等键创建或取得 run，再由统一 admission service 发放带 fencing token 的执行租约；worker 只写入当前 epoch。进度走可覆盖快照，里程碑与终态走追加日志；完成通知通过 outbox 投递，消费者按 runid + terminalversion 去重。同步、提交、流式只是等待策略不同，不得绕过同一准入状态机。 验收不变量 故障注入：分别在子 agent 运行中杀死父 worker、替换部署版本、断开客户端并让模型流卡死。必须满足：同一 runid 最终只有一个终态；旧 lease epoch 不能继续提交；完成副作用按幂等键最多一次；进度在重连后可恢复；超过 budget 的任务最终释放并发槽；嵌套阻塞准入在执行任何工具前被拒绝。 边界与风险 这是官方产品发布说明而非独立评测；协调器、持久日志和 outbox 本身会增加写放大与恢复复杂度。实验性的 server actions/channels 不应成为首版依赖；最小落地只实现 run 注册、租约、里程碑、终态和协调扫描。"},{"id":"2026-07-23_13-34-2","order":2,"title":"Secure Agent Workspace：端点只展示，Agent 在受管边界内执行","problem":"来源事实/作者主张： 长时间运行的 Agent 会读取文件、执行命令、调用企业系统；若在用户端点或普通共享环境内执行，就难以统一执行 SSO、网络默认拒绝、短期凭证、人审门和中心审计，Agent 还可能静默扩大自身权限。","score":97,"tags":["身份与权限","文件与工件","工具与协议"],"type":"Engineering","sources":[{"label":"NVIDIA 官方技术博客","url":"https://developer.nvidia.com/blog/how-to-govern-autonomous-agents-in-enterprise-ai-factories"},{"label":"企业参考架构","url":"https://docs.nvidia.com/enterprise-reference-architectures/secure-agent-workspace-reference-design/latest/index.html"},{"label":"OpenShell 官方仓库","url":"https://github.com/NVIDIA/OpenShell"}],"report":"reports/2026-07-23/2026-07-23_13-34.md","round":"2026-07-23_13-34","runLabel":"2026-07-23 13:34","searchText":"2. secure agent workspace：端点只展示，agent 在受管边界内执行 评分：97/100（来源 24、问题 20、架构 24、证据 14、服务端价值 15） 原始来源： nvidia 官方技术博客 · 企业参考架构 · openshell 官方仓库 针对的问题 来源事实/作者主张： 长时间运行的 agent 会读取文件、执行命令、调用企业系统；若在用户端点或普通共享环境内执行，就难以统一执行 sso、网络默认拒绝、短期凭证、人审门和中心审计，agent 还可能静默扩大自身权限。 本项目工程推断： “用户登录过的电脑”不是可继承的 agent 信任域。端点身份只能用于建立会话，不能直接变成沙箱内的长期密钥或无限制网络能力。 原设计 nvidia 将笔记本、浏览器、ide 和终端定义为 presentation layer；实际执行进入每用户受管 vm。外层由 trusted access broker、sso、默认拒绝出站、中心日志和工作区生命周期控制；内层由 runtime sandbox、签名策略、credential proxy、推理网关与工具前审批控制。策略和 vm 模板用 gitops 管理，原始凭证尽量留在代理后方，审计输出到 siem/ocsf 路径。openshell 仓库给出容器、网关、策略引擎和推理路由实现，但明确标注为 alpha、single-player。 对 agent 服务器的采用设计 把 workspaceid 作为运行、身份和审计的共同边界。控制面依据用户委托创建短期工作区和 capability manifest；数据面只接收签名策略、任务级令牌和允许的 artifact。所有模型与工具调用经 egress/credential proxy，沙箱从不读取上游原始密钥。高影响工具动作先写 pendingaction，由工作区外的审批服务决定；端点断线不改变执行权限，也不使权限续期。 验收不变量 故障注入：在工作区内尝试读取长期密钥、访问未授权域、修改策略文件、绕过代理直连工具，并伪造过期策略版本。五项必须全部失败且生成审计事件；每次外部工具调用都能关联 tenantid/userdelegation/workspaceid/runid/policyversion；撤销工作区后，旧会话和旧 capability 均不得恢复访问。 边界与风险 参考架构带有供应商立场，未给出独立生产评估；每用户 vm 的隔离强但容量和运维成本高。openshell 当前不是成熟多租户控制面，因此可采用架构不变量，但不能把仓库现状当作企业级隔离已经完成。"},{"id":"2026-07-23_13-34-3","order":3,"title":"Arca：在等待边界保存“余下程序”，而不是冻结整个进程","problem":"来源事实/作者主张： serverless 风格任务经常短算长等；传统进程或 MicroVM 快照恢复需要数百毫秒，开发者只好预先把程序人工拆成函数和显式状态，既妨碍细粒度调度，也难以把执行迁移到数据位置。","score":97,"tags":["状态与恢复","运行时与调度","文件与工件"],"type":"Paper","sources":[{"label":"OSDI 2026 正式论文页","url":"https://www.usenix.org/conference/osdi26/presentation/srivatsan"},{"label":"论文 PDF","url":"https://www.usenix.org/system/files/osdi26-srivatsan.pdf"}],"report":"reports/2026-07-23/2026-07-23_13-34.md","round":"2026-07-23_13-34","runLabel":"2026-07-23 13:34","searchText":"3. arca：在等待边界保存“余下程序”，而不是冻结整个进程 评分：97/100（来源 25、问题 20、架构 25、证据 15、服务端价值 12） 原始来源： osdi 2026 正式论文页 · 论文 pdf 针对的问题 来源事实/作者主张： serverless 风格任务经常短算长等；传统进程或 microvm 快照恢复需要数百毫秒，开发者只好预先把程序人工拆成函数和显式状态，既妨碍细粒度调度，也难以把执行迁移到数据位置。 本项目工程推断： agent 等待模型、工具、人审或外部事件时，如果只能保持 worker 或从顶层重跑，就会在资源占用与恢复正确性之间二选一。 原设计 arca 把 continuation capture 做成 os 核心服务：程序在 i/o 边界返回一个 effect（期望的外部操作）与 callback continuation，effect handler 执行 i/o，之后恢复 continuation。论文报告 arca 的 snapshot/resume 为 2.55 微秒、缩略图工作负载相对非 continuation 方案加速 50–60 倍；这些是作者实验。状态可暂停、迁移或复制，但 socket 状态、共享可变内存和广泛 posix 兼容性构成根本或工程限制。 对 agent 服务器的采用设计 不移植 arca os，而采用其“计算与 effect 分离”边界。把每次模型/工具/人审等待编译为 continuationrecord：包含不可变 workflow 版本、下一状态、局部变量引用、artifact 哈希和 effect 请求；调度器可在任意兼容 worker 恢复。外部 i/o 只由 effect gateway 执行，并要求 capability、幂等键和结果收据。continuation 中禁止保存 socket、线程对象、明文凭证和进程地址。 验收不变量 故障注入：在工具请求已发出、结果未写回时杀死 worker，并把 continuation 迁移到另一节点恢复。必须满足：恢复后的逻辑状态与单机无故障执行相同；同一 effect 幂等键不产生第二个外部副作用；快照不包含不可迁移句柄或密钥；等待期间 worker cpu/内存租约可释放。 边界与风险 arca 是研究原型，只有部分 posix 支持且不支持共享可变内存；其微秒数据不能直接套用到数据库持久化的 agent continuation。真正落地应保存逻辑状态而非本机内存镜像，并接受比论文更高的持久化延迟以换取可审计与兼容性。"},{"id":"2026-07-23_13-34-4","order":4,"title":"StriaTrace：常开骨架 trace，异常时才提高细节","problem":"来源事实/作者主张： 在线 LLM 推理的 TTFT/TPOT 偶发尖峰即可违反 SLO；全量 CPU/GPU profiler 开销过高，训练侧以秒或分钟发现持久 straggler 的工具又抓不到单次慢 token。工程师常被迫加日志、重新发布并等待复现。","score":96,"tags":["文件与工件","工具与协议","运行时与调度"],"type":"Paper","sources":[{"label":"OSDI 2026 正式论文页","url":"https://www.usenix.org/conference/osdi26/presentation/wu-haonan"},{"label":"论文 PDF","url":"https://www.usenix.org/system/files/osdi26-wu-haonan.pdf"}],"report":"reports/2026-07-23/2026-07-23_13-34.md","round":"2026-07-23_13-34","runLabel":"2026-07-23 13:34","searchText":"4. striatrace：常开骨架 trace，异常时才提高细节 评分：96/100（来源 25、问题 20、架构 24、证据 15、服务端价值 12） 原始来源： osdi 2026 正式论文页 · 论文 pdf 针对的问题 来源事实/作者主张： 在线 llm 推理的 ttft/tpot 偶发尖峰即可违反 slo；全量 cpu/gpu profiler 开销过高，训练侧以秒或分钟发现持久 straggler 的工具又抓不到单次慢 token。工程师常被迫加日志、重新发布并等待复现。 本项目工程推断： agent 服务若只有请求总耗时，就不能区分模型排队、kv 读写、跨进程同步、工具等待和 orchestrator 停顿；但每步全量采样会反过来伤害尾延迟。 原设计 striatrace 只在约十个关键跨机/跨进程同步点做常开 tracing，gpu 侧聚焦关键路径的 kernel 与 memory copy，异常时再采集 py-spy 栈等细节；动态回归 roofline 与相关性诊断用于定位原因。作者报告相对替代方案降低 97.8% tracing 开销，生产周期中诊断数百次异常、覆盖 19 类根因。cpu 采样可能漏掉微小停顿，cuda driver/runtime 细节也因开销而被省略。 对 agent 服务器的采用设计 为 request → orchestrator → model gateway → scheduler → inference worker → tool gateway 定义最小同步点集合，常开记录阶段开始/结束、队列时间、版本和资源维度；按模型、上下文长度、batch 与租户类别维护动态基线。只有超过基线或 slo 的 request 才触发有限时窗的细粒度栈、gpu 或工具诊断；所有升级采样都写入独立诊断预算。 验收不变量 注入模型排队、kv 存储回退、cpu gil 争用和慢工具四类故障。必须满足：常开 tracing 对 p99 的额外开销低于 2%；异常请求在诊断 slo 内定位到正确层级；每条选中请求的关键同步路径连续；正常请求不产生高细节 trace；采样失败不影响业务请求完成。 边界与风险 论文面向 vllm 推理层，不覆盖完整 agent 工作流；97.8% 和根因数量均是作者环境结果。动态基线可能把缓慢劣化当成正常，异常触发也可能遗漏一次性短故障，因此必须保留独立 slo 告警和少量随机审计样本。"},{"id":"2026-07-23_13-34-5","order":5,"title":"AWS Support Companion：每个 Agent 依赖都要有超时、降级与刷新契约","problem":"来源事实/作者主张： 一次支持调查在控制台、日志、文档、社区和工单间切换，开始处置前可耗费 30–45 分钟。实现中又有三个明确运行时故障：MCP 服务顺序初始化增加冷启动；Memory 读取可能阻塞主请求；Gateway JWT 一小时到期后产生间歇调用失败。","score":92,"tags":["工具与协议","运行时与调度","记忆与上下文"],"type":"Engineering","sources":[{"label":"AWS 官方技术博客","url":"https://aws.amazon.com/blogs/machine-learning/build-an-ai-powered-aws-support-companion-with-amazon-bedrock-agentcore/"},{"label":"官方样例仓库","url":"https://github.com/aws-samples/sample-support-agent-with-agentcore"}],"report":"reports/2026-07-23/2026-07-23_13-34.md","round":"2026-07-23_13-34","runLabel":"2026-07-23 13:34","searchText":"5. aws support companion：每个 agent 依赖都要有超时、降级与刷新契约 评分：92/100（来源 24、问题 18、架构 22、证据 14、服务端价值 14） 原始来源： aws 官方技术博客 · 官方样例仓库 针对的问题 来源事实/作者主张： 一次支持调查在控制台、日志、文档、社区和工单间切换，开始处置前可耗费 30–45 分钟。实现中又有三个明确运行时故障：mcp 服务顺序初始化增加冷启动；memory 读取可能阻塞主请求；gateway jwt 一小时到期后产生间歇调用失败。 本项目工程推断： agent 平台的“集成完成”不等于生产可用；每个远程依赖都必须声明是否关键、等待多久、如何降级和何时刷新。 原设计 样例将容器化 agent runtime、三个 mcp server、agentcore gateway、memory、api gateway/cognito/waf、guardrails 和 cloudformation 分层。mcp 客户端用 asyncio.gather(..., returnexceptions=true) 并行初始化；memory 只取最近三轮且限时 2 秒，超时则无记忆继续，响应后异步保存；gateway token 每次调用前检查，并在到期前 5 分钟刷新。部署脚本还检查 cloudtrail、模板和临时凭证，运行侧配置最小 iam、pii 脱敏和审计。 对 agent 服务器的采用设计 建立 dependencycontract：对每个模型、mcp、memory、identity 和 guardrail 声明 criticality/timeout/retry/fallback/tokenrefreshmargin/circuitbreaker/auditfields。启动阶段并行发现，但在准入完成时冻结本次 run 的工具清单版本；非关键依赖降级必须进入响应 metadata 与 trace。令牌刷新由 identity sidecar 负责，agent 代码只拿短期 handle；高权限工具必须经过策略与人审，不能因故障降级而绕过。 验收不变量 故障注入：让一个 mcp server 不可用、memory 超过 2 秒、gateway token 距过期 4 分钟、guardrail 返回错误。必须满足：非关键依赖故障时请求在 slo 内以显式 degraded 状态完成；令牌在首次失败前刷新；关键安全依赖失败时 fail closed；工具清单版本在单次 run 内不漂移；每个降级和刷新决定都有审计原因。 边界与风险 这是 aws 供应商样例，不是独立性能研究；部分服务受区域、支持计划和费用约束。无记忆降级可能造成语义不一致，异步保存也需要幂等和失败补偿；参考架构只能证明实现路径存在，不能证明默认参数适合本项目负载。 取舍与剩余库存 本轮发布 cloudflare、nvidia、aws 各 1 篇，osdi 正式论文 2 篇，未超过同一机构 2 篇，并覆盖持久后台运行、受控执行边界、状态迁移、低开销诊断和依赖降级 5 个不同问题。两个原有库存均重新核验了日期、正式来源与技术细节后才入选。 本轮另拒绝 2 项：microsoft azure 文章只给出 2026-06-23 日期，无法证明晚于本轮精确下界，且实现证据不足；mas-orchestra 原始发布日期在窗口外，openreview 的修改时间不能单独证明发生了实质性更新。发布后剩余合格未发布库存为 0。"},{"id":"2026-07-23_11-59-1","order":1,"title":"Murakkab：让 SLO 成为 Agent 工作流运行时的输入","problem":"来源事实/作者主张： 现有 Agent 框架把工作流逻辑、模型选择、参数和 CPU/GPU 配置写在同一个命令式 DAG 中；配置空间随工作流、Agent 与硬件旋钮组合增长，负载或资源变化后必须人工改写和重部署。作者报告，静态框架不能区分高准确率与低延迟请求，造成资源浪费和 SLO 违约。","score":98,"tags":["状态与恢复","运行时与调度","文件与工件"],"type":"Paper","sources":[{"label":"OSDI 2026 正式论文页","url":"https://www.usenix.org/conference/osdi26/presentation/chaudhry"},{"label":"论文 PDF","url":"https://www.usenix.org/system/files/osdi26-chaudhry.pdf"}],"report":"reports/2026-07-23/2026-07-23_11-59.md","round":"2026-07-23_11-59","runLabel":"2026-07-23 11:59","searchText":"1. murakkab：让 slo 成为 agent 工作流运行时的输入 评分：98/100（来源 25、问题 20、架构 25、证据 14、服务端价值 14） 原始来源： osdi 2026 正式论文页 · 论文 pdf 针对的问题 来源事实/作者主张： 现有 agent 框架把工作流逻辑、模型选择、参数和 cpu/gpu 配置写在同一个命令式 dag 中；配置空间随工作流、agent 与硬件旋钮组合增长，负载或资源变化后必须人工改写和重部署。作者报告，静态框架不能区分高准确率与低延迟请求，造成资源浪费和 slo 违约。 本项目工程推断： 服务端若只对“整个 agent pod”扩缩容，就看不到阶段级瓶颈，也无法在质量、延迟和成本间做请求级选择。 原设计 murakkab 用声明式规格分离工作流结构、任务依赖和低层执行配置；离线画像形成模型、硬件、并行度与工作流旋钮的候选集合，优化器先按准确率、ttft/tpot、成本等 slo 过滤，再由自适应运行时映射组件并随负载重配置。论文在多种工作流上报告 gpu 用量最多降低 2.8 倍、能耗 3.7 倍、成本 4.3 倍，同时保持 slo；这些是作者实验结果，不是本项目复测结论。 对 agent 服务器的采用设计 把每个 agent 版本编译为不可变 workflowir，节点只声明输入输出、候选实现、资源画像和副作用等级；控制面维护 executionprofile 与 planversion，入口按 latency/quality/cost 请求类别选择已验证计划。运行中只允许在同一兼容性集合内重配置；涉及副作用的工具节点不得因成本优化而自动换实现。 验收不变量 故障注入：在 30 分钟内将某模型队列延迟提高 3 倍并制造 gpu 紧张。必须满足：所有已接受请求的 slo 违约率不高于静态基线；任何计划切换都能由 requestid + workflowversion + planversion 重放；副作用工具的实现和幂等键不因重配置改变。 边界与风险 论文评估不等于真实业务质量；画像会老化，错误画像可能把流量推向不可行配置。最小实现应先做 slo 分类、计划版本和影子评估，不应一开始建设全局求解器。"},{"id":"2026-07-23_11-59-2","order":2,"title":"libDSE：持久执行可以投机，但外部可见性不能投机","problem":"来源事实/作者主张： 常见 durable execution 在每个任务输出后同步持久化，延迟开销随任务图深度累积；若直接省略持久化，非确定性重放会产生分叉任务和冲突副作用。","score":98,"tags":["状态与恢复","文件与工件","工具与协议"],"type":"Paper","sources":[{"label":"OSDI 2026 正式论文页","url":"https://www.usenix.org/conference/osdi26/presentation/li-tianyu"},{"label":"论文 PDF","url":"https://www.usenix.org/system/files/osdi26-li-tianyu.pdf"}],"report":"reports/2026-07-23/2026-07-23_11-59.md","round":"2026-07-23_11-59","runLabel":"2026-07-23 11:59","searchText":"2. libdse：持久执行可以投机，但外部可见性不能投机 评分：98/100（来源 25、问题 20、架构 25、证据 15、服务端价值 13） 原始来源： osdi 2026 正式论文页 · 论文 pdf 针对的问题 来源事实/作者主张： 常见 durable execution 在每个任务输出后同步持久化，延迟开销随任务图深度累积；若直接省略持久化，非确定性重放会产生分叉任务和冲突副作用。 本项目工程推断： 长 agent 链最危险的不是重复计算，而是把尚不可恢复的中间决定发给用户、支付系统或外部工具。 原设计 libdse 把状态操作组织成原子 action，以消息头记录因果依赖；协调器维护依赖图，只有落在“可恢复闭包”中的结果才能对外暴露。故障时用单调递增的 failure sequence 协调各参与者回滚，并禁止恢复前后两个世代相互消费消息。论文给出的核心保证是最终修复不一致，以及外部实体永远看不到故障诱发的不一致；作者报告持久化受限应用端到端延迟最多降低一个数量级。 对 agent 服务器的采用设计 不直接复刻 libdse，而采用其边界：推理、纯读取和可丢弃中间产物可在 speculationepoch 内并行；工具写操作、用户最终答复和事件发布必须等待依赖闭包提交。每条内部消息携带 runid/actionid/stateversion/failureepoch；恢复后拒绝旧 epoch 消息。 验收不变量 故障注入：在“工具返回成功、状态尚未持久化”窗口杀死 orchestrator，并制造重复恢复。必须满足：外部系统最多观察到一个相同幂等键的提交；旧 failure epoch 的消息不进入新状态；最终公开答复引用的每个 action 均位于已提交依赖闭包。 边界与风险 论文假设 fail-restart、可靠点对点通信且不处理拜占庭故障；回滚协议和依赖图本身有显著复杂度。第一阶段只应对纯计算分支投机，外部副作用仍使用同步 outbox/幂等提交。"},{"id":"2026-07-23_11-59-3","order":3,"title":"Cloud Run sandboxes：工具执行默认拿不到凭证、网络和持久写权限","problem":"来源事实/作者主张： AI 生成代码或不可信二进制若与宿主服务同权限运行，可能读取环境变量和云元数据凭证、通过网络外传数据，并污染共享文件系统。","score":95,"tags":["身份与权限","文件与工件","安全与隔离"],"type":"Engineering","sources":[{"label":"Google Cloud 官方工程博客","url":"https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-run-sandboxes-are-in-public-preview/"}],"report":"reports/2026-07-23/2026-07-23_11-59.md","round":"2026-07-23_11-59","runLabel":"2026-07-23 11:59","searchText":"3. cloud run sandboxes：工具执行默认拿不到凭证、网络和持久写权限 评分：95/100（来源 24、问题 20、架构 23、证据 13、服务端价值 15） 原始来源： google cloud 官方工程博客 针对的问题 来源事实/作者主张： ai 生成代码或不可信二进制若与宿主服务同权限运行，可能读取环境变量和云元数据凭证、通过网络外传数据，并污染共享文件系统。 本项目工程推断： “容器里再起子进程”不是 agent 工具隔离；执行单元必须默认没有控制面的身份和出站能力。 原设计 cloud run 在现有服务实例内启动轻量隔离边界。沙箱看不到服务环境变量和元数据服务器，网络出站默认拒绝，容器文件系统只读，写入进入执行结束即丢弃的内存 overlay；导入、导出文件和开放出站均需显式参数。官方示例启动并销毁 1,000 个沙箱的平均延迟为 500ms，这是供应商演示数据。 对 agent 服务器的采用设计 tool gateway 只向沙箱传递任务级 capability 和输入 artifact，不挂载租户长期凭证。网络按目标域、方法和时间窗签发一次性 egress grant；产物只通过扫描后的 export 通道进入 artifact store，并绑定 tenantid/runid/toolcallid。 验收不变量 故障注入脚本同时尝试读取环境变量、访问云元数据、连接未授权域名和修改根文件系统。四项必须全部失败；只有列入授权的导出文件可在沙箱结束后存在，且产物哈希与审计事件一致。 边界与风险 该能力仍是 public preview；博客未给出隔离实现的独立安全评估。共享宿主资源也意味着需另做 cpu、内存、进程数和 fork-bomb 限额。"},{"id":"2026-07-23_11-59-4","order":4,"title":"Web Bot Authentication：共享出口 IP 不能充当 Agent 身份","problem":"来源事实/作者主张： 多租户运行时中成千上万个 Agent 共享 IP，IP 白名单和反向 DNS 无法区分调用者，User-Agent 又可伪造，导致合法 Agent 被拦截或攻击者被误放行。","score":94,"tags":["身份与权限","安全与隔离","工具与协议"],"type":"Engineering","sources":[{"label":"AWS Security 官方技术博客","url":"https://aws.amazon.com/blogs/security/authenticate-legitimate-ai-agent-traffic-with-aws-waf-bot-control/"}],"report":"reports/2026-07-23/2026-07-23_11-59.md","round":"2026-07-23_11-59","runLabel":"2026-07-23 11:59","searchText":"4. web bot authentication：共享出口 ip 不能充当 agent 身份 评分：94/100（来源 24、问题 20、架构 23、证据 13、服务端价值 14） 原始来源： aws security 官方技术博客 针对的问题 来源事实/作者主张： 多租户运行时中成千上万个 agent 共享 ip，ip 白名单和反向 dns 无法区分调用者，user-agent 又可伪造，导致合法 agent 被拦截或攻击者被误放行。 本项目工程推断： tool gateway 的出站身份必须绑定请求内容、密钥和时效，不能继承宿主网络位置的信任。 原设计 agent 运营者在目录发布公钥，并依据 rfc 9421 对 http 消息签名；边缘验证 ed25519 签名后写入 verified、invalid、expired 或 unknownbot 标签，再由策略决定放行、限速、告警或阻断。签名输入含 authority、key id、created、expires、nonce 等；aws 同时提供账户级标签和监控指标。 对 agent 服务器的采用设计 在统一 egress proxy 内完成签名，私钥不进入 agent 沙箱。密钥按租户与调用角色轮换；策略同时校验签名、目标 audience、工具 capability 和用户委托链。接收侧保留验证标签、key id、nonce 与决策原因。 验收不变量 故障注入：重放已签名请求、篡改 authority、使用过期密钥、从另一租户复用签名。四种请求均不得获得 verified；同一 nonce 在有效窗内只接受一次；未知身份只能进入显式隔离策略，不能继承默认放行。 边界与风险 wba 证明请求由某密钥持有者发出，不证明 agent 行为被用户授权，也不替代 oauth/obo。文中的独立注册 api 仍在 roadmap，标准与供应商支持可能变化。"},{"id":"2026-07-23_11-59-5","order":5,"title":"Structured memory filtering with metadata in AgentCore Memory：先确定边界，再做相似度","problem":"来源事实/作者主张： 单靠 namespace 只能隔离“谁”，在同一客户数月历史中，语义相似的不同部门、时间或优先级记录仍会混入结果。作者在 151 问题测试集上报告总体 QA 准确率由 40% 升至 64%，依赖上下文边界的问题由 16% 升至 69%。","score":92,"tags":["记忆与上下文","安全与隔离","身份与权限"],"type":"Engineering","sources":[{"label":"AWS 官方技术博客","url":"https://aws.amazon.com/blogs/machine-learning/structured-memory-filtering-with-metadata-in-agentcore-memory/"}],"report":"reports/2026-07-23/2026-07-23_11-59.md","round":"2026-07-23_11-59","runLabel":"2026-07-23 11:59","searchText":"5. structured memory filtering with metadata in agentcore memory：先确定边界，再做相似度 评分：92/100（来源 24、问题 19、架构 21、证据 14、服务端价值 14） 原始来源： aws 官方技术博客 针对的问题 来源事实/作者主张： 单靠 namespace 只能隔离“谁”，在同一客户数月历史中，语义相似的不同部门、时间或优先级记录仍会混入结果。作者在 151 问题测试集上报告总体 qa 准确率由 40% 升至 64%，依赖上下文边界的问题由 16% 升至 69%。 本项目工程推断： 记忆污染既是质量问题，也是越权问题；租户边界不能交给 embedding 或 llm 推断。 原设计 设计分三阶段：配置时声明可索引 schema；摄取时把确定性字段原样传播，把允许推断的字段交给 llm；检索时先执行 namespace 与元数据过滤，再做 knn。strictlyconsistent 字段还参与抽取和合并分区，值不同的记录不会因语义相似而合并。 对 agent 服务器的采用设计 将 tenantid/principalid/dataclassification 设为应用写入且不可由模型推断的安全键；topic/sentiment 才允许模型推断。查询由策略层注入安全过滤器，agent 只能追加业务相关过滤条件，不能删除或放宽安全条件。记录保留来源 agent、workflow step 和写入事件 id。 验收不变量 故障注入：写入内容高度相似但租户、部门或密级不同的记录，并诱导 agent 请求“忽略过滤”。返回集必须 100% 满足服务端注入的安全谓词；不同确定性键的记录不得合并；每条召回结果可追溯到原始事件。 边界与风险 评估由供应商报告且未独立复现；最多三个 strictlyconsistent 键、十个索引槽且索引键不可删除，会把早期 schema 决策变成迁移成本。元数据过滤也不能替代存储层访问控制。 取舍与剩余库存 本轮入选覆盖 5 个不同生产问题，osdi 论文 2 篇、google 1 篇、aws 2 篇，未超过同一机构 2 篇。验证后预计剩余 2 个合格未发布候选：一个面向在线 llm 推理异常诊断，一个是可部署的 agentcore 支持助手参考架构；前者与本轮资源/运行观测主题接近，后者因 aws 来源上限和架构新颖性较低暂缓。另有 3 个候选分别因来源/架构证据不足、偏硬件产品叙事、agent 服务端价值未达 12 分而拒绝；1 篇 tmlr 论文只有 2026-06-23 日期、无法证明落在本轮精确下界之后，按时间门槛拒绝。"},{"id":"2026-07-23_11-07-1","order":1,"title":"SeaweedFS：过期客户端不能靠“最后写入者获胜”","problem":"针对的问题。 多个客户端先读取同一个文件版本，再分别写回。若只是普通覆盖，后到的旧客户端会静默抹掉新内容；若先查再写但不是原子操作，两个写者仍可能同时通过检查。","score":94,"tags":["文件与工件"],"type":"Engineering","sources":[{"label":"Conditional Writes Without a Compare-and-Swap Store","url":"https://seaweedfs.com/blog/conditional-writes/"}],"report":"reports/2026-07-23/2026-07-23_11-07.md","round":"2026-07-23_11-07","runLabel":"2026-07-23 11:07","searchText":"1. seaweedfs：过期客户端不能靠“最后写入者获胜” 来源与时效。 seaweedfs 官方工程博客 conditional writes without a compare-and-swap store，2026-07-16，由 seaweedfs team 发布，给出组件分层、路由、锁、条件词汇和失败码，满足 e 类。 针对的问题。 多个客户端先读取同一个文件版本，再分别写回。若只是普通覆盖，后到的旧客户端会静默抹掉新内容；若先查再写但不是原子操作，两个写者仍可能同时通过检查。 原设计。 条件写把“检查前提＋写入”作为一个不可分事务。seaweedfs 不要求所有底层元数据存储都支持 cas，而是按对象 key 一致性哈希到唯一 owner filer；该 owner 用 per-path 本地锁串行化同一对象的写，检查 if-match/if-none-match 后再提交。不匹配返回 412 precondition failed。 对 agent 服务器的采用设计（工程推断）。 单服务器不需要一致性哈希环，但应保留相同语义：所有 fileid 的版本提交经过一个 metadata transaction；客户端或 agent 提交时携带 baseversion。只有 baseversion == currentversion 才允许推进指针，否则返回 412，并保留双方版本供显式合并。 验收不变量。 两个客户端基于 v7 并发提交时，最多一个能把 current pointer 从 v7 推到新版本；另一个必须得到 412，且任何已提交不可变版本都不能被覆盖或丢失。 边界。 seaweedfs 的 owner routing 是集群内部实现；你的单服务器第一版只需数据库行锁或原子 cas。不要过早复制一致性哈希和分布式 filer。"},{"id":"2026-07-23_11-07-2","order":2,"title":"W3C：永久链接应标识资源，临时 URL 只负责传输","problem":"针对的问题。 当本地路径、云端对象 key、签名下载 URL 和业务链接都被称为“文件链接”时，任一层变化都会造成 link rot。客户端也无法判断一个 URL 是稳定身份、当前版本指针，还是即将过期的下载能力。","score":92,"tags":["文件与工件","身份与权限","工具与协议"],"type":"Engineering","sources":[{"label":"Report on Interoperability for Agents on the Web","url":"https://w3c-cg.github.io/webagents/TaskForces/Interoperability/Reports/report-interoperability.html"}],"report":"reports/2026-07-23/2026-07-23_11-07.md","round":"2026-07-23_11-07","runLabel":"2026-07-23 11:07","searchText":"2. w3c：永久链接应标识资源，临时 url 只负责传输 来源与时效。 w3c webagents community group 的 report on interoperability for agents on the web，2026-07-17 draft community group report，编辑和作者来自 inria、university of st. gallen、ucd 等机构。它是社区组草案，不是 w3c recommendation。 针对的问题。 当本地路径、云端对象 key、签名下载 url 和业务链接都被称为“文件链接”时，任一层变化都会造成 link rot。客户端也无法判断一个 url 是稳定身份、当前版本指针，还是即将过期的下载能力。 原设计。 报告强调 identifier 与 identity 的区别、用 iri/uri 在上下文之外稳定标识资源、一个 iri 只标识一个资源、资源语义变化时采用版本化 iri，并要求可选择地监控资源更新。它还指出 mcp 的 resources/subscribe 与 notifications/resources/updated 需要能力协商且并非统一支持。 对 agent 服务器的采用设计（工程推断）。 定义两类业务链接：/files/{fileid} 是稳定逻辑资源，解析到当前版本；/files/{fileid}/versions/{versionid} 是不可变版本资源。对象存储 signed url 永远不进入数据库或消息正文，只在解析版本资源时临时生成。重命名只改 display path，不改变 fileid。 验收不变量。 对同一 fileid，重命名、移动、重新签发下载 url都不改变逻辑链接；固定 version url 在生命周期内始终返回同一 hash；一个 url 不得在不同时间悄悄代表语义不同的逻辑文件。 边界。 w3c 草案讨论的是开放多 agent web 互操作，不提供你的文件元数据 schema；这里采用的是其身份、版本化和资源监控原则。"},{"id":"2026-07-23_11-07-3","order":3,"title":"AWS S3：先给每个对象版本一个身份证，再谈缓存","problem":"针对的问题。 对象更新期间的临时 404 或旧响应可能被边缘/客户端缓存；即使服务器随后正确，错误状态仍会长时间传播。没有 version ID 时，客户端也无法证明“本地文件对应云端哪个版本”。","score":91,"tags":["文件与工件","状态与恢复","身份与权限"],"type":"Engineering","sources":[{"label":"Zero-downtime Amazon S3 Versioning: Architectural patterns for mission-critical workloads","url":"https://aws.amazon.com/blogs/storage/zero-downtime-amazon-s3-versioning-architectural-patterns-for-mission-critical-workloads/"}],"report":"reports/2026-07-23/2026-07-23_11-07.md","round":"2026-07-23_11-07","runLabel":"2026-07-23 11:07","searchText":"3. aws s3：先给每个对象版本一个身份证，再谈缓存 来源与时效。 aws storage blog zero-downtime amazon s3 versioning: architectural patterns for mission-critical workloads，2026-07-01，包含 vercel 生产案例、版本启用状态机和验证步骤，满足 e 类。 针对的问题。 对象更新期间的临时 404 或旧响应可能被边缘/客户端缓存；即使服务器随后正确，错误状态仍会长时间传播。没有 version id 时，客户端也无法证明“本地文件对应云端哪个版本”。 原设计。 s3 versioning 为每个对象版本分配唯一 version id。文章展示既有高流量 bucket 从 unversioned 经 suspended 预传播，再切换到 enabled 的阶段式迁移，并用 headobject 检查 x-amz-version-id，避免暂态 404 被 cdn 放大。 对 agent 服务器的采用设计（工程推断）。 从第一天启用版本语义；元数据 manifest 同时保存 fileid + versionid + contenthash。缓存 key 必须包含 version id；/files/{fileid} 的解析响应使用短 ttl/etag，具体 version 下载使用长 ttl 和 immutable cache-control。404 也要区分“尚未发布”“已删除”“版本不存在”，不能统一长期缓存。 验收不变量。 客户端声称“已同步”时，本地记录的 versionid 与服务器 current version 相等，并且重新计算的 hash 与 manifest 相等。服务器 current pointer 变化后，旧 version url仍可返回旧字节，但 stable resolver 必须返回新 version。 边界。 文章重点是启用 s3 versioning 的迁移风险，不是完整客户端同步协议；vercel 数据是厂商案例。你的核心设计不应依赖 s3，任何能提供不可变对象和版本 id 的存储都可以。"},{"id":"2026-07-23_11-07-4","order":4,"title":"APNIC：用通知减少延迟，用对账保证最终正确","problem":"针对的问题。 只轮询会慢且浪费；只推送事件会因断线丢事件；每次传整个文件集会随客户端和数据规模失控。服务器变化后，本地一直停留在旧版本，本质上是“通知”和“对账”没有分层。","score":90,"tags":["文件与工件","状态与恢复","观测与评测"],"type":"Engineering","sources":[{"label":"Data synchronization","url":"https://blog.apnic.net/2026/07/13/data-synchronization/"}],"report":"reports/2026-07-23/2026-07-23_11-07.md","round":"2026-07-23_11-07","runLabel":"2026-07-23 11:07","searchText":"4. apnic：用通知减少延迟，用对账保证最终正确 来源与时效。 apnic 官方技术博客 geoff huston 的 data synchronization，2026-07-13。文章比较全量覆盖、rsync、snapshot+delta、push、push-notify/pull、merkle tree 及一致性模型，满足 e 类。 针对的问题。 只轮询会慢且浪费；只推送事件会因断线丢事件；每次传整个文件集会随客户端和数据规模失控。服务器变化后，本地一直停留在旧版本，本质上是“通知”和“对账”没有分层。 原设计。 apnic 将同步方法放在网络、计算、规模和一致性的权衡中：rsync 做块级差异；snapshot+delta 只传变化；push-notify/pull 用通知消除轮询不确定性；merkle tree 适合大量数据和客户端的差异定位。单权威源和多主写入需要完全不同的一致性方案。 对 agent 服务器的采用设计（工程推断）。 你的场景明确为单服务器权威源：正常路径用 fileversionpublished(fileid, versionid, hash, eventseq) 通知，客户端收到后自行 pull；断线重连从 cursor 拉 delta。若 cursor 已过期或检测到序列缺口，拉取 workspace manifest snapshot；文件量很大后再增加 merkle root 对账。 验收不变量。 丢弃、重复、乱序 10% 的通知后，每个在线客户端最终仍收敛到服务器 manifest；重复事件不重复写盘；发现 event gap 时必须进入对账而不是假定本地已最新。 边界。 文章是通用同步综述，不替你选择强一致或冲突策略。由于你的服务器是单一真相源，可以避免 p2p consensus；若未来允许离线本地编辑，必须另行定义冲突语义。"},{"id":"2026-07-23_11-07-5","order":5,"title":"AG-UI：事件流是失效通知，不是文件内容真相源","problem":"针对的问题。 多种 Agent runtime 各自输出不同流格式，前端难以统一处理状态更新；客户端断线或多个客户端观察同一 run 时，很容易把“看到某条完成消息”误当作“文件已生成并同步”。","score":88,"tags":["文件与工件","工具与协议","状态与恢复"],"type":"Engineering","sources":[{"label":"Build generative UI for AI agents on Amazon Bedrock AgentCore with the AG-UI protocol","url":"https://aws.amazon.com/blogs/machine-learning/build-generative-ui-for-ai-agents-on-amazon-bedrock-agentcore-with-the-ag-ui-protocol/"}],"report":"reports/2026-07-23/2026-07-23_11-07.md","round":"2026-07-23_11-07","runLabel":"2026-07-23 11:07","searchText":"5. ag-ui：事件流是失效通知，不是文件内容真相源 来源与时效。 aws 官方高级技术博客 build generative ui for ai agents on amazon bedrock agentcore with the ag-ui protocol，2026-06-30，含参考代码、架构图、事件和双向状态示例，满足 e 类。 针对的问题。 多种 agent runtime 各自输出不同流格式，前端难以统一处理状态更新；客户端断线或多个客户端观察同一 run 时，很容易把“看到某条完成消息”误当作“文件已生成并同步”。 原设计。 ag-ui 以标准事件连接 agent backend 和 frontend，支持 state snapshot、tool-call events、双向共享状态和 human-in-the-loop。aws 示例把框架事件翻译为统一 ag-ui 流，并让前端解析器与具体 agent 框架解耦。 对 agent 服务器的采用设计（工程推断）。 在 ag-ui 或自有 sse/websocket 流中只发送文件领域事件和版本引用，不发送本地路径或长期下载 url：artifactexpected、artifactversionpublished、artifactverificationfailed、artifactdeleted。事件只触发客户端重新解析/拉取；真正判断文件是否存在和是否相同，仍查询 manifest 并校验 hash。 验收不变量。 收到 artifactversionpublished 但下载/校验失败时，客户端不得显示“已同步”；断线重连必须先用 snapshot/cursor 补齐状态，再恢复增量流；两个客户端最终显示相同 fileid/versionid/hash 三元组。 边界。 ag-ui 本身不定义文件版本、持久化或可靠消息语义，把它直接当文件同步协议会重现你的 bug。它只适合作为通知与交互适配层。 对第一个 bug 的最小修复切片 第一阶段只做以下五项，暂不做离线多主合并、crdt 或完整虚拟文件系统： 1. 建 files、fileversions、runexpectedartifacts 三张元数据表。 2. agent 只能写临时路径；服务端完成 hash/验证/manifest 提交后才发布版本。 3. 客户端永久保存 fileid，本地索引保存 versionid + hash + localpath；不保存 signed url 作为业务链接。 4. 所有 current pointer 更新必须携带 baseversion，过期写返回 412。 5. 建可重放的 artifact event log；实时通知负责快，manifest 对账负责正确。 建议状态机： ``text expected → uploading → verifying → available ↘ failed available → superseded | deleted ` agent run 只有在所有 required artifact 都进入 available 且拥有 verification receipt 后才能 succeeded`。这把“agent 是否生成文件”“本地是否同一版本”“link 是否过期”拆成三个独立、可观测、可测试的问题。 核验说明 - 五篇均在滚动 30 天窗口内，且未在上一轮正式发布；ag-ui 是上一轮留存的 eligible 库存，本轮因专项相关性进入报告。 - w3c 材料明确标为 community group draft，没有冒充正式标准。 - aws 和 seaweedfs 的实现/案例属于厂商或项目方一手陈述；报告中的通用数据模型与采用步骤是工程推断。 - 2026-06-08 的 aws 持久 workspace 文章与 2026-02 的 fast skysync 论文虽高度相关，但超出 30 天窗口，因此没有计入本轮五篇。"},{"id":"2026-07-23_10-51-1","order":1,"title":"RECEIPT：不要相信 Agent 的“我完成了”","problem":"针对的问题。 Agent 既执行任务又判断自己是否成功，会出现奖励投机或“自证正确”：声称漏洞存在、声称文件已生成、声称副作用已完成，但环境已经污染、证据不可重放或产物根本不存在。","score":94,"tags":["文件与工件","观测与评测","安全与隔离"],"type":"Paper","sources":[{"label":"RECEIPT: Deterministic, Reward-Hacking-Resistant Verification for White-Box Agentic XSS Discovery","url":"https://arxiv.org/abs/2607.18575"},{"label":"Berkeley 官方主页","url":"https://vcresearch.berkeley.edu/faculty/david-wagner"}],"report":"reports/2026-07-23/2026-07-23_10-51.md","round":"2026-07-23_10-51","runLabel":"2026-07-23 10:51","searchText":"1. receipt：不要相信 agent 的“我完成了” 来源与时效。 receipt: deterministic, reward-hacking-resistant verification for white-box agentic xss discovery，2026-07-20 提交的 arxiv 预印本。作者包含 uc berkeley 的     const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
    const state = { query: "", round: "", tag: "" };

    $("#articleStat").textContent = DATA.articleCount;
    $("#roundStat").textContent = DATA.roundCount;
    $("#latestStat").textContent = DATA.latestRun.slice(5);
    $("#generatedAt").textContent = `首页生成于 ${DATA.generated.replace("T", " ")}`;

    for (const round of DATA.rounds) {
      const option = document.createElement("option");
      option.value = round.round;
      option.textContent = `${round.runLabel} · ${round.count} 篇`;
      $("#roundFilter").append(option);
    }

    const chipEntries = [["", DATA.articleCount], ...Object.entries(DATA.tagCounts)];
    for (const [tag, count] of chipEntries) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.dataset.tag = tag;
      button.setAttribute("aria-pressed", tag === "" ? "true" : "false");
      button.textContent = `${tag || "全部主题"} ${count}`;
      button.addEventListener("click", () => {
        state.tag = tag;
        document.querySelectorAll(".chip").forEach(item =>
          item.setAttribute("aria-pressed", String(item.dataset.tag === tag))
        );
        render();
      });
      $("#chips").append(button);
    }

    function card(article) {
      const primary = article.sources[0];
      const sourceLink = primary
        ? `<a href="${escapeHtml(primary.url)}" target="_blank" rel="noreferrer">原始来源 ↗</a>`
        : "";
      const score = article.score ? `<span class="score">${article.score}/100</span>` : "";
      return `<article class="card" id="${escapeHtml(article.id)}">
        <div class="meta"><span>${escapeHtml(article.runLabel)} · ${escapeHtml(article.type)}</span>${score}</div>
        <h3>${escapeHtml(article.title)}</h3>
        <p class="problem">${escapeHtml(article.problem)}</p>
        <div class="tags">${article.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        <div class="actions">${sourceLink}<a href="${escapeHtml(article.report)}">完整 Markdown →</a></div>
      </article>`;
    }

    function render() {
      const query = state.query.trim().toLocaleLowerCase("zh-CN");
      const filtered = DATA.articles.filter(article => {
        const queryMatch = !query || article.searchText.includes(query) ||
          article.title.toLocaleLowerCase("zh-CN").includes(query) ||
          article.problem.toLocaleLowerCase("zh-CN").includes(query);
        const roundMatch = !state.round || article.round === state.round;
        const tagMatch = !state.tag || article.tags.includes(state.tag);
        return queryMatch && roundMatch && tagMatch;
      });
      $("#articleGrid").innerHTML = filtered.map(card).join("");
      $("#resultCount").textContent = `显示 ${filtered.length} / ${DATA.articleCount} 篇`;
      $("#emptyState").style.display = filtered.length ? "none" : "block";
    }

    $("#search").addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });
    $("#roundFilter").addEventListener("change", event => {
      state.round = event.target.value;
      render();
    });
    render();
  </script>
